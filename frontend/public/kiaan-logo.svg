<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ktGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="10" y="10" width="180" height="180" rx="42" fill="url(#ktGradient)" filter="url(#shadow)"/>
  
  <!-- Subtle border outline -->
  <rect x="12" y="12" width="176" height="176" rx="40" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>

  <!-- Tech Accent Lines -->
  <path d="M 40 45 L 85 45" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="95" cy="45" r="4" fill="#93C5FD"/>

  <!-- 'K' Character Representation -->
  <g fill="#FFFFFF" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900">
    <text x="36" y="132" font-size="94" letter-spacing="-4">K</text>
    <text x="104" y="132" font-size="94" fill="#93C5FD" letter-spacing="-4">T</text>
  </g>

  <!-- Dot pulse accent -->
  <circle cx="166" cy="122" r="7" fill="#67E8F9"/>

  <!-- Modern Sub-label -->
  <text x="100" y="162" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3.5">KIAAN</text>
</svg>

